# Local development environment (the online deployment is a later phase).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: internal_requests
      MYSQL_USER: irm
      MYSQL_PASSWORD: secret
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  worker:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    command: ["php", "artisan", "queue:work"]
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  mysql-data:
  frontend-node-modules:
