# Local development environment (the online deployment is a later phase).
# Host ports come from the root .env (see .env.example), so several worktrees can run at once.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: internal_requests
      MYSQL_USER: irm
      MYSQL_PASSWORD: secret
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  api:
    build: ./backend
    environment:
      PHP_CLI_SERVER_WORKERS: 4
      APP_URL: http://localhost:${API_PORT:-8000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  worker:
    build: ./backend
    command: ["php", "artisan", "queue:work"]
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "false"
      APP_URL: http://localhost:${API_PORT:-8000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  mysql-data:
  frontend-node-modules:
